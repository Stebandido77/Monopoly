# Monopoly standard US board — official Hasbro values (modern edition).
# 40 spaces, indexed 0..39 starting at GO and proceeding clockwise.
#
# Schema notes:
#   - All monetary values are USD as printed on the board.
#   - rent (streets):  [base, with_1_house, with_2_houses, with_3_houses, with_4_houses, with_hotel]
#                      Base rent doubles automatically when the owner holds the full color group
#                      with no houses built (handled by the rules engine, not duplicated here).
#   - rent (railroads): [1_owned, 2_owned, 3_owned, 4_owned]
#   - rent_multipliers (utilities): [1_owned, 2_owned] -> multiplied by the dice roll.
#   - mortgage_value: half of price for streets and railroads, $75 for utilities.
#   - Bank inventories of houses (32) and hotels (12) are global limits enforced by the engine.

bank:
  starting_money: 1500
  go_salary: 200
  jail_fine: 50
  total_houses: 32
  total_hotels: 12

